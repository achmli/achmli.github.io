{% assign waline_assets = 'https://cdn.jsdelivr.net/npm/@waline/client@3.16.2/dist' %}
<section id="comments" lang="zh-CN" aria-labelledby="comments-heading">
    <h2 id="comments-heading">评论</h2>
    <div id="waline"
         data-server-url="{{ include.server_url | escape }}"
         data-path="{{ page.url | relative_url | escape }}"></div>
    <p id="waline-error" role="status" hidden>评论加载失败，请刷新后重试。</p>
    <noscript><p>启用 JavaScript 后即可查看和发布评论。</p></noscript>
</section>

<link rel="stylesheet" href="{{ waline_assets }}/waline.css">
<script type="module">
    const el = document.getElementById('waline');

    try {
        const { init } = await import('{{ waline_assets }}/waline.js');
        init({
            el,
            serverURL: el.dataset.serverUrl,
            path: el.dataset.path,
            lang: 'zh-CN',
            login: 'disable',
            meta: ['nick'],
            requiredMeta: [],
            emoji: false,
            imageUploader: false,
            search: false,
            locale: {
                nick: '昵称（选填）',
                anonymous: '匿名',
                placeholder: '写下你的评论',
                submit: '发布',
            },
        });
    } catch (error) {
        document.getElementById('waline-error').hidden = false;
        console.error('Waline initialization failed', error);
    }
</script>
