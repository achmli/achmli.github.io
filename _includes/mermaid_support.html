<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  // rouge has no mermaid lexer, so kramdown falls back to rendering ```mermaid
  // fences as plain <pre><code class="language-mermaid">. Restore the raw
  // diagram source and hand it to mermaid.js instead.
  document.querySelectorAll('code.language-mermaid').forEach((codeEl) => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = codeEl.textContent;
    (codeEl.closest('pre') || codeEl).replaceWith(pre);
  });

  mermaid.initialize({ startOnLoad: true });
</script>
